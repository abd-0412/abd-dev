<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Meta Tags -->
  <title>Page Not Found | Abdul Ajees M</title>
  <meta name="description" content="This page doesn't exist. But the portfolio of Abdul Ajees M, web developer and agency founder, does.">
  <meta name="robots" content="noindex, follow">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0D0D0B;
      --ink: #FAFAF8;
      --ink-muted: rgba(250, 250, 248, 0.6);
      --indigo: #2D2B8F;
      --blue: #4F8EF7;
      --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-fast: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      --font-headings: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Custom Cursor */
    #cur-dot, #cur-ring {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      transform: translate3d(-50%, -50%, 0);
      display: none;
    }

    @media (hover: hover) and (pointer: fine) {
      body, a, button, [role="button"], .interactive-hover {
        cursor: none !important;
      }
      #cur-dot {
        display: block;
        width: 6px;
        height: 6px;
        background: var(--blue);
        border-radius: 50%;
        z-index: 9999;
        transition: width 0.3s, height 0.3s, background-color 0.3s;
      }
      #cur-ring {
        display: block;
        width: 36px;
        height: 36px;
        border: 1px solid var(--blue);
        border-radius: 50%;
        z-index: 9998;
        transition: width 0.3s, height 0.3s, border-color 0.3s, background-color 0.3s, opacity 0.3s;
      }
      #cur-dot.active {
        width: 10px;
        height: 10px;
        background-color: var(--blue);
      }
      #cur-ring.hovered {
        background-color: rgba(79, 142, 247, 0.08) !important;
        border-color: var(--blue) !important;
        width: 56px !important;
        height: 56px !important;
        opacity: 1 !important;
      }
    }

    /* Ambient Glow */
    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(600px, 90vw);
      height: min(600px, 90vh);
      background: radial-gradient(circle, rgba(45, 43, 143, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Content Layout */
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    .error-code {
      font-family: var(--font-headings);
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 900;
      line-height: 1;
      color: var(--ink);
      margin-bottom: 1.5rem;
      letter-spacing: -0.04em;
      opacity: 0;
      transform: translateY(30px);
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .error-code em {
      font-family: var(--font-headings);
      font-style: italic;
      font-weight: 400;
      color: var(--blue);
    }

    .title {
      font-family: var(--font-headings);
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
      opacity: 0;
      transform: translateY(30px);
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
    }

    .description {
      font-size: clamp(1rem, 3vw, 1.15rem);
      color: var(--ink-muted);
      margin-bottom: 3rem;
      font-weight: 300;
      opacity: 0;
      transform: translateY(30px);
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem 2.5rem;
      border-radius: 100px;
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 700;
      background: var(--blue);
      color: white;
      text-decoration: none;
      transition: var(--transition-fast);
      border: 1px solid transparent;
      box-shadow: 0 8px 32px rgba(79, 142, 247, 0.15);
      opacity: 0;
      transform: translateY(30px);
      animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
    }

    .btn:hover {
      background: white;
      color: var(--bg);
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(255, 255, 255, 0.15);
    }

    .btn svg {
      transition: transform 0.25s ease;
    }

    .btn:hover svg {
      transform: translateX(-4px);
    }

    @keyframes revealUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <!-- Custom Cursor Elements -->
  <div id="cur-dot"></div>
  <div id="cur-ring"></div>

  <!-- Ambient Glow in Background -->
  <div class="ambient-glow"></div>

  <div class="container">
    <div class="error-code">4<em>0</em>4</div>
    <h1 class="title">This page doesn't exist.</h1>
    <p class="description">But my portfolio does.</p>
    
    <a href="/" class="btn interactive-hover">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Portfolio</span>
    </a>
  </div>

  <script>
    // Custom Cursor logic
    const dot = document.getElementById('cur-dot');
    const ring = document.getElementById('cur-ring');

    let mouseX = 0, mouseY = 0;
    let dotX = 0, dotY = 0;
    let ringX = 0, ringY = 0;
    let hasMoved = false;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      hasMoved = true;
    });

    function updateCursor() {
      if (hasMoved) {
        dotX = mouseX;
        dotY = mouseY;
        dot.style.transform = `translate3d(${dotX}px, ${dotY}px, 0) translate3d(-50%, -50%, 0)`;

        ringX += (mouseX - ringX) * 0.28;
        ringY += (mouseY - ringY) * 0.28;
        ring.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate3d(-50%, -50%, 0)`;
      }
      requestAnimationFrame(updateCursor);
    }
    requestAnimationFrame(updateCursor);

    document.addEventListener('mouseleave', () => {
      dot.style.display = 'none';
      ring.style.display = 'none';
    });
    
    document.addEventListener('mouseenter', () => {
      if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
        dot.style.display = 'block';
        ring.style.display = 'block';
      }
    });

    const hoverTargets = document.querySelectorAll('a, button, .interactive-hover');
    hoverTargets.forEach(target => {
      target.addEventListener('mouseenter', () => {
        if (dot) dot.classList.add('active');
        if (ring) ring.classList.add('hovered');
      });
      target.addEventListener('mouseleave', () => {
        if (dot) dot.classList.remove('active');
        if (ring) ring.classList.remove('hovered');
      });
    });
  </script>
</body>
</html>
